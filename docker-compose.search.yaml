# Minimal deployment: /search and /extract only (no research, no UI).
# Usage:
#   docker compose -f docker-compose.search.yaml up -d
#
# Tavily-compatible endpoint: http://localhost:8081
#   POST /search  — drop-in for TavilyClient(base_url="http://localhost:8081")
#   POST /extract — URL → clean markdown

services:
  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - valkey-data2:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - ./config.yaml:/etc/searxng/settings.yml:ro
      - searxng-data:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
      - BIND_ADDRESS=[::]:8080
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  tavily-adapter:
    build:
      context: ./simple_tavily_adapter
      dockerfile: Dockerfile.search
    container_name: tavily-adapter
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "8081:8000"
    volumes:
      - ./config.yaml:/srv/searxng-docker/config.yaml:ro
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  searxng:

volumes:
  valkey-data2:
  searxng-data:
